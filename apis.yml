aid: color
name: Color
description: >-
  Color Health is an oncologist-led virtual cancer care company that provides
  screening, early detection, diagnosis, treatment guidance, and survivorship
  support to employers, health plans, unions, consultants, and public-sector
  organizations. Originally founded as a genomics testing company (Color
  Genomics), Color now operates a virtual clinical platform combining at-home
  testing kits, preventive health programs, and AI-assisted cancer care. For
  integration partners Color publishes a developer documentation surface at
  docs.color.com covering an Eligibility List API, Self-Reported Results and
  Vaccination Status APIs, SAML-based SSO, and SFTP/PGP file transfer for
  eligibility, claims, and member-event data.
