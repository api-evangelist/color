            $ref: '#/components/schemas/CycleThresholdValue'
        organization:
          title: Organization
          description: The organization this participant belongs to.
          type: string
          minLength: 1
        test_type:
          title: Test type
          description: The type of test of the result, valid values include 'Rapid' and 'Individual Lab'
          type: string
    SampleApi:
      required:
      - kit_barcode
      - activated_at
      - received_at_lab
      - collected_at
      - processing_lab
      - participant_id
      - resulted_at
      - cancelled_at
      type: object
      properties:
        kit_barcode:
          title: Kit barcode
          description: Barcode included in the test collection kit.
          type: string
          minLength: 1
        activated_at:
          title: Activated at
          description: When the sample was activated, null otherwise.
          type: string
          format: date-time
        received_at_lab:
          title: Received at lab
          description: When the sample was received at the lab.
          type: string
          format: date-time
        collected_at:
          title: Collected at
          description: When the sample was collected.
          type: string
          format: date-time
        processing_lab:
          title: Processing lab
          description: name of processing lab if available, null otherwise.
          type: string
        participant_id:
          title: Participant id
          description: The public id of the participant, can be used to query participant status endpoint.
          type: string
          minLength: 1
          nullable: true
        resulted_at:
          title: Resulted at
          description: When the sample was resulted, null otherwise.
          type: string
          format: date-time
        cancelled_at:
          title: Cancelled at
          description: When the sample was cancelled, null otherwise.
          type: string
          format: date-time
    SelfReportedResultApi:
      type: object
      properties:
        participant_id:
          title: Participant id
          description: The patient ID of the participant with self reported test results
          type: string
          minLength: 1
          nullable: true
        patient:
          $ref: '#/components/schemas/PatientProfileResultApi'
        population:
          title: Population
          description: The population this participant belongs to in the organization
          type: string
          minLength: 1
        test_type:
          title: Test type
          description: The type of test reported by the participant.
          type: string
          enum:
          - covid-19 rapid
          - Abbott BinaxNOW
          - Lucira Check It
          - Quidel QuickVue
          - BinaxNOW COVID-19 Ag Card
          - BinaxNOW COVID-19 Ag Card Home Test
          - BinaxNOW COVID-19 Antigen Self Test
          - BinaxNOW COVID-19 Ag Card 2 Home Test
          - BinaxNOW COVID-19 Ag 2 Card
          - CareStart COVID-19 Antigen test
          - BD Veritor System for Rapid Detection of SARS-CoV-2
          - Celltrion DiaTrust COVID-19 Ag Rapid Test
          - Ellume COVID-19 Home Test
          - Clip COVID Rapid Antigen Test
          - LumiraDx SARS-CoV-2 Ag Test
          - Sofia SARS Antigen FIA
          - QuickVue At-Home OTC COVID-19 Test
          - QuickVue SARS Antigen Test
          - Accula SARS-Cov-2 Test
          - ID NOW COVID-19
          - iHealth COVID-19 Antigen Rapid Test
          - Cue COVID-19 Test
          - Cue COVID-19 Test for Home and Over The Counter (OTC) Use
          - Lucira CHECK-IT COVID-19 Test Kit
          - Lucira COVID-19 All-In-One Test Kit
          - Visby Medical COVID-19 Point of Care Test
          - Other rapid test
          - Other lab-based test
        test_significance:
          title: Test significance
          description: Indicates significance of the test result.
          type: string
          enum:
          - Detected
          - Not Detected
          - Inconclusive
        test_date:
          title: Test date
          description: The date the patient took the test, not the date the test was reported.
          type: string
          format: date
        reported_at:
          title: Reported at
          description: When the participant first reported this test result
          type: string
          format: date-time
      required:
      - participant_id
      - patient
      - population
      - test_type
      - test_significance
      - test_date
      - reported_at
