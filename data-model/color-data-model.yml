summary: >-
  Color's External API V1 models one domain: a covered POPULATION inside a
  customer ORGANIZATION, the ELIGIBILITY ENTRIES that make a person eligible, the
  PARTICIPANT that person becomes once enrolled, the SAMPLES they activate, and
  the RESULTS those samples produce. Population and organization are string keys,
  not addressable resources — there is no /populations or /organizations resource
  to read, so an agent must be told the population name out of band.
