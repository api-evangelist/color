lifecycle:
  sample:
    states: [activated, accessioned, approved_for_processing, resulted, cancelled,
      destroyed]
    timestamps: [activated_at, received_at_lab, collected_at, resulted_at, cancelled_at]
    transitions:
    - operation: samples_accession_create
      effect: records arrival at the lab
    - operation: samples_results_create
      effect: records a result; requires the sample to be accessioned and approved
    - operation: samples_destroy_create
      effect: records destruction; rejected if the sample is approved for processing
  participant:
    compliance_state: [untested, compliant, activated_not_accessioned, overdue, positive]
    note: Enumerated in prose in the ParticipantStatusApi description, not as a schema
      enum.
phi:
  contains_phi: true
  fields: [first_name, middle_name, last_name, birthday, sex, email, phone_number,
    address, race_ethnicity, vaccination_status, significance, cycle_thresholds]
  note: >-
    Every read operation on this API returns identified patient data. This is a
    HIPAA-covered surface; treat the whole data model as minimum-necessary scoped.
gaps:
- No population or organization resource — both are string keys with no read endpoint.
- No delete on any entity; eligibility entries are soft-invalidated via invalidated_at.
- >-
  ParticipantStatusApi, ResultApi and SelfReportedResultApi are list-only; there is
  no by-id read for a single participant or result.
