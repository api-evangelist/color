- field: id
  entity: EligibilityEntry
  format: UUID
  note: Also usable as the path parameter on the retrieve/update endpoints.
- field: unique_identifier
  entity: EligibilityEntry
  format: customer-supplied
  note: >-
    Paired with identifier_type (email, employee_id, …). This is the join key the
    customer also puts on claims and member-event files.
- field: external_id
  entity: EligibilityEntry, ParticipantStatusApi, PatientProfileResultApi
  format: customer-supplied
  note: University or employer ID number; passed through so the customer can match
    results.
- field: participant_id
  entity: ParticipantStatusApi, SampleApi, SelfReportedResultApi
  format: opaque string
  note: Color's public patient ID; the documented way to query a participant from a
    sample.
- field: kit_barcode
  entity: SampleApi, SampleResultApi, SampleParticipantStatusApi
  format: string
  note: Barcode printed on the collection kit; the read-side sample key.
- field: sample_barcode
  entity: path parameter on the three lab operations
  format: '^D-\d{10}$'
  note: >-
    The write-side sample key, and the only regex-constrained identifier in the
    contract. Published as a pattern in the spec.
- field: accession_number
  entity: accession response
  format: 'C-#####'
  note: Assigned by Color when a sample is accessioned, e.g. "C-12345".
